[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv", "venv", "runs", "research"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "E741", "B008", "B905", "UP007", "UP045"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
