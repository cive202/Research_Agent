name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Lint
        run: ruff check .
      - name: Tests (LLM and search are mocked, no API keys needed)
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t market-research:ci .
      - name: Smoke test (container serves the app)
        run: |
          docker run -d --name app -p 8501:8501 -e USE_SAMPLE_DATA=1 market-research:ci
          for i in $(seq 1 30); do
            curl -fs http://localhost:8501/_stcore/health && exit 0
            sleep 2
          done
          docker logs app
          exit 1
